name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Capture (Chromium) is skipped in CI — thumbnails are committed at authoring
    # time — so never download Playwright browsers on install (ADR-0012 §4).
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      # Version comes from the package.json `packageManager` field (pnpm@11.1.2)
      # so CI matches local exactly — newer pnpm 11.x stopped reading the
      # `pnpm.onlyBuiltDependencies` field and broke the install.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # pnpm 11.1.2 doesn't honor `onlyBuiltDependencies` from pnpm-workspace.yaml,
        # so esbuild/sharp/unrs-resolver builds get blocked → ERR_PNPM_IGNORED_BUILDS.
        # Allow the (first-party) build scripts to run so the install succeeds.
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Generate template registry
        run: pnpm generate:templates

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Blocking template gate (ADR-0012 §4): validate-json / validate-files /
      # schema↔jsx consistency / thumbnail-path across every template. This is
      # the precondition that lets registration auto-run after deploy.
      - name: Verify templates
        run: pnpm template:verify:ci
