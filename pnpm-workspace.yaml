# pnpm blocks dependency build (install) scripts by default. This is the
# allow-list pnpm itself writes via `pnpm approve-builds` — booleans, NOT a
# string list. These first-party native deps must build (sharp = image native
# binary, esbuild = bundler binary, unrs-resolver = eslint resolver).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
verifyDepsBeforeRun: false
